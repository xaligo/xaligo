[package]
name = "xaligo-engine-ffi"
description = "Stable C ABI for the xaligo Rust engine static library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "xaligo_engine"
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
xaligo-layout-engine = { path = "../layout-engine" }
xaligo-svg-engine = { path = "../svg-engine" }
