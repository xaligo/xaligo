[workspace]
members = [
    "crates/ffi",
    "crates/layout-engine",
    "crates/svg-engine",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/xaligo/xaligo"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
