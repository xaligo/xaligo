[package]
name = "xaligo-pptx-exporter"
description = "WASI PPTX exporter for resolved xaligo document plans"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/xaligo/xaligo"

[lib]
name = "xaligo_pptx_exporter"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "xaligo-exporter"
path = "src/ctl/command.rs"

[dependencies]
base64 = "0.22.1"
pptx = "0.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
zip = { version = "7.2.0", default-features = false, features = ["deflate-flate2-zlib-rs", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
