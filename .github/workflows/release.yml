name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3 — without leading v). When set, it must match VERSION.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      base_version: ${{ steps.meta.outputs.base_version }}
      native_version: ${{ steps.meta.outputs.native_version }}
      npm_version: ${{ steps.meta.outputs.npm_version }}
      deb_version: ${{ steps.meta.outputs.deb_version }}
      rpm_version: ${{ steps.meta.outputs.rpm_version }}
      rpm_release: ${{ steps.meta.outputs.rpm_release }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_title: ${{ steps.meta.outputs.release_title }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      npm_tag: ${{ steps.meta.outputs.npm_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
          RELEASE_INPUT_VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          scripts/build/release-metadata.sh >> "$GITHUB_OUTPUT"

  quality:
    name: Release quality gate
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/cargo-target
      ENGINE_STATICLIB: ${{ github.workspace }}/.cache/cargo-target/release/libxaligo_engine.a

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/cargo-target
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('external/**/Cargo.lock', 'test/unit/external/**/Cargo.lock') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Set up security scanner
        run: make security-setup

      - name: Run security gate
        run: make security-check

      - name: Run Go tests and build
        run: |
          make test-engine
          go build ./...

      - name: Test npm native installer
        run: |
          npm run test:npm-installer
          npm run test:release-metadata

  native:
    name: Build native binary (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            rust_target: x86_64-apple-darwin
          - target: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            rust_target: aarch64-apple-darwin
          - target: linux-amd64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            rust_target: x86_64-unknown-linux-gnu
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            rust_target: aarch64-unknown-linux-gnu
          - target: windows-amd64
            runner: windows-2025
            goos: windows
            goarch: amd64
            rust_target: x86_64-pc-windows-gnu
          - target: windows-arm64
            runner: windows-11-arm
            goos: windows
            goarch: arm64
            rust_target: aarch64-pc-windows-gnullvm
            cgo_cc: aarch64-w64-mingw32-clang

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Install Rust target
        shell: bash
        run: rustup target add "${{ matrix.rust_target }}"

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            external/engine/target
          key: cargo-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust_target }}-${{ hashFiles('external/engine/Cargo.lock') }}
          restore-keys: |
            cargo-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust_target }}-

      - name: Install LLVM-MinGW for Windows ARM64
        if: matrix.cgo_cc == 'aarch64-w64-mingw32-clang'
        shell: pwsh
        env:
          LLVM_MINGW_VERSION: '20260616'
          LLVM_MINGW_SHA256: 312593669435bd0bfc1a43ac3fba23c8b27e0610bade88b2738e5a01702a99ba
        run: |
          $asset = "llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-aarch64.zip"
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/$asset"
          Invoke-WebRequest -Uri $url -OutFile $archive

          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:LLVM_MINGW_SHA256) {
            throw "LLVM-MinGW checksum mismatch: $actual"
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP -Force
          $toolchain = Join-Path $env:RUNNER_TEMP "llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-aarch64"
          $bin = Join-Path $toolchain 'bin'
          $compiler = Join-Path $bin 'aarch64-w64-mingw32-clang.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "LLVM-MinGW compiler not found: $compiler"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      - name: Build Rust-linked native binary
        shell: bash
        env:
          NATIVE_VERSION: ${{ needs.metadata.outputs.native_version }}
          NPM_PACKAGE_TARGETS: ${{ matrix.goos }}/${{ matrix.goarch }}
          CC: ${{ matrix.cgo_cc || '' }}
        run: scripts/build/build-npm.sh

      - name: Verify native checksum
        shell: bash
        run: |
          cd bin/native
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum --check "xaligo-${{ matrix.goos }}-${{ matrix.goarch }}"*.sha256
          else
            shasum -a 256 --check "xaligo-${{ matrix.goos }}-${{ matrix.goarch }}"*.sha256
          fi

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: xaligo-native-${{ matrix.target }}
          path: bin/native/*
          if-no-files-found: error

  package:
    name: Build package (${{ matrix.format }}, ${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            goarch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            dockerfile: docker/ubuntu.Dockerfile
            image: xaligo-package-ubuntu
          - format: deb
            goarch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: docker/ubuntu.Dockerfile
            image: xaligo-package-ubuntu
          - format: rpm
            goarch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            dockerfile: docker/rocky.Dockerfile
            image: xaligo-package-rocky
          - format: rpm
            goarch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: docker/rocky.Dockerfile
            image: xaligo-package-rocky

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build packaging toolchain image
        run: docker build --platform "${{ matrix.platform }}" -f "${{ matrix.dockerfile }}" -t "${{ matrix.image }}" .

      - name: Build Debian package
        if: matrix.format == 'deb'
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e NATIVE_VERSION="${{ needs.metadata.outputs.native_version }}" \
            -e PACKAGE_VERSION="${{ needs.metadata.outputs.deb_version }}" \
            -e GOARCH="${{ matrix.goarch }}" \
            -e GOFLAGS="-buildvcs=false" \
            "${{ matrix.image }}" \
            scripts/build/build-deb.sh

      - name: Build RPM package
        if: matrix.format == 'rpm'
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e NATIVE_VERSION="${{ needs.metadata.outputs.native_version }}" \
            -e PACKAGE_VERSION="${{ needs.metadata.outputs.rpm_version }}" \
            -e PACKAGE_RELEASE="${{ needs.metadata.outputs.rpm_release }}" \
            -e GOARCH="${{ matrix.goarch }}" \
            -e GOFLAGS="-buildvcs=false" \
            "${{ matrix.image }}" \
            scripts/build/build-rpm.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: xaligo-package-${{ matrix.format }}-${{ matrix.goarch }}
          path: |
            output/packages/*.deb
            output/packages/*.rpm
          if-no-files-found: error

  npm-package:
    name: Build npm package
    runs-on: ubuntu-24.04
    needs: metadata

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Build and pack npm distribution
        shell: bash
        env:
          NATIVE_VERSION: ${{ needs.metadata.outputs.native_version }}
          NPM_VERSION: ${{ needs.metadata.outputs.npm_version }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
          NPM_PACKAGE_TARGETS: none
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node -e 'const fs=require("node:fs"); const path="package.json"; const pkg=JSON.parse(fs.readFileSync(path, "utf8")); const version=fs.readFileSync("VERSION", "utf8").trim().replace(/^v/, ""); if (pkg.version !== version || process.env.NPM_VERSION !== version) throw new Error("package.json, VERSION, and NPM_VERSION must match"); pkg.xaligo={...(pkg.xaligo || {}), releaseTag: process.env.RELEASE_TAG}; fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");'
          npm run test:npm-installer
          npm run test:release-metadata
          npm run build:npm-binaries
          mkdir -p output/packages
          npm pack --pack-destination output/packages

      - name: Upload npm package
        uses: actions/upload-artifact@v4
        with:
          name: xaligo-npm-package
          path: output/packages/*.tgz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - metadata
      - quality
      - native
      - package
      - npm-package

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: xaligo-*
          path: output/release
          merge-multiple: true

      - name: Verify native binary checksums
        shell: bash
        run: |
          mapfile -t checksums < <(find output/release -maxdepth 1 -type f -name 'xaligo-*.sha256' -print | sort)
          if [[ "${#checksums[@]}" -ne 6 ]]; then
            echo "Expected 6 native binary checksums, found ${#checksums[@]}." >&2
            exit 1
          fi
          for checksum in "${checksums[@]}"; do
            (
              cd output/release
              sha256sum --check "$(basename "$checksum")"
            )
          done

      - name: Create GitHub Release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
          RELEASE_TITLE: ${{ needs.metadata.outputs.release_title }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          NATIVE_VERSION: ${{ needs.metadata.outputs.native_version }}
          NPM_VERSION: ${{ needs.metadata.outputs.npm_version }}
          DEB_VERSION: ${{ needs.metadata.outputs.deb_version }}
          RPM_VERSION: ${{ needs.metadata.outputs.rpm_version }}
          RPM_RELEASE: ${{ needs.metadata.outputs.rpm_release }}
        shell: bash
        run: |
          args=(
            "$RELEASE_TAG"
            output/release/*.deb
            output/release/*.rpm
            output/release/*.tgz
            output/release/xaligo-darwin-*
            output/release/xaligo-linux-*
            output/release/xaligo-windows-*
            --target "$GITHUB_SHA"
            --title "$RELEASE_TITLE"
            --notes "Automated package build. Native: ${NATIVE_VERSION}; npm: ${NPM_VERSION}; Debian: ${DEB_VERSION}; RPM: ${RPM_VERSION}-${RPM_RELEASE}."
            --repo "$GITHUB_REPOSITORY"
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              output/release/*.deb \
              output/release/*.rpm \
              output/release/*.tgz \
              output/release/xaligo-darwin-* \
              output/release/xaligo-linux-* \
              output/release/xaligo-windows-* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "${args[@]}"
          fi

      - name: Set up Node.js for npm publish
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@xaligo'

      - name: Publish stable npm package
        if: needs.metadata.outputs.prerelease == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ needs.metadata.outputs.npm_tag }}
          NPM_VERSION: ${{ needs.metadata.outputs.npm_version }}
        run: |
          if npm view "@xaligo/xaligo@${NPM_VERSION}" version >/dev/null 2>&1; then
            echo "@xaligo/xaligo@${NPM_VERSION} is already published; skipping."
            exit 0
          fi
          npm publish output/release/*.tgz --access public --tag "$NPM_TAG"
