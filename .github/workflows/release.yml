name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3 — without leading v). Defaults to VERSION.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      base_version: ${{ steps.meta.outputs.base_version }}
      package_version: ${{ steps.meta.outputs.package_version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_title: ${{ steps.meta.outputs.release_title }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      npm_tag: ${{ steps.meta.outputs.npm_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          input_version="${{ github.event.inputs.version || '' }}"
          source_version="$(sed -n '1{s/^v//;p;q;}' VERSION)"
          base_version="${input_version:-$source_version}"

          if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $base_version. Must be X.Y.Z" >&2
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "push" ]]; then
            package_version="${base_version}+main.${{ github.run_number }}"
            release_tag="main-${{ github.run_number }}"
            release_title="xaligo ${base_version} main ${{ github.run_number }}"
            prerelease="true"
            npm_tag="latest"
          else
            package_version="$base_version"
            release_tag="v${base_version}"
            release_title="xaligo v${base_version}"
            prerelease="false"
            npm_tag="latest"
          fi

          {
            echo "base_version=$base_version"
            echo "package_version=$package_version"
            echo "release_tag=$release_tag"
            echo "release_title=$release_title"
            echo "prerelease=$prerelease"
            echo "npm_tag=$npm_tag"
          } >> "$GITHUB_OUTPUT"

  package:
    name: Build packages (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            platform: linux/amd64
          - goarch: arm64
            platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Ubuntu package image
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --load \
            -f docker/ubuntu.Dockerfile \
            -t "xaligo-package-ubuntu:${{ matrix.goarch }}" \
            .

      - name: Build Debian package
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e VERSION="${{ needs.metadata.outputs.package_version }}" \
            -e GOARCH="${{ matrix.goarch }}" \
            -e GOFLAGS="-buildvcs=false" \
            "xaligo-package-ubuntu:${{ matrix.goarch }}" \
            scripts/build/build-deb.sh

      - name: Build Rocky package image
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --load \
            -f docker/rocky.Dockerfile \
            -t "xaligo-package-rocky:${{ matrix.goarch }}" \
            .

      - name: Build RPM package
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e VERSION="${{ needs.metadata.outputs.package_version }}" \
            -e GOARCH="${{ matrix.goarch }}" \
            -e GOFLAGS="-buildvcs=false" \
            "xaligo-package-rocky:${{ matrix.goarch }}" \
            scripts/build/build-rpm.sh

      - name: Build npm package
        if: matrix.goarch == 'amd64'
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e VERSION="${{ needs.metadata.outputs.package_version }}" \
            -e RELEASE_TAG="${{ needs.metadata.outputs.release_tag }}" \
            -e GOFLAGS="-buildvcs=false" \
            -e NPM_PACKAGE_TARGETS="darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64" \
            "xaligo-package-ubuntu:${{ matrix.goarch }}" \
            sh -ec '
              npm install --no-audit --no-fund
              node -e "const fs=require(\"node:fs\"); const path=\"package.json\"; const pkg=JSON.parse(fs.readFileSync(path, \"utf8\")); pkg.version=process.env.VERSION; pkg.xaligo={...(pkg.xaligo || {}), releaseTag: process.env.RELEASE_TAG}; fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + \"\n\");"
              npm run build
              npm run build:npm-binaries
              mkdir -p output/packages
              npm pack --pack-destination output/packages
              cp bin/native/xaligo-* output/packages/
            '

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: xaligo-packages-${{ matrix.goarch }}
          path: |
            output/packages/*.deb
            output/packages/*.rpm
            output/packages/*.tgz
            output/packages/xaligo-*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - metadata
      - package

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: xaligo-packages-*
          path: output/release
          merge-multiple: true

      - name: Create GitHub Release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
          RELEASE_TITLE: ${{ needs.metadata.outputs.release_title }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
        shell: bash
        run: |
          args=(
            "$RELEASE_TAG"
            output/release/*.deb
            output/release/*.rpm
            output/release/*.tgz
            output/release/xaligo-darwin-*
            output/release/xaligo-linux-*
            output/release/xaligo-windows-*
            --target "$GITHUB_SHA"
            --title "$RELEASE_TITLE"
            --notes "Automated package build. Package version: ${PACKAGE_VERSION}."
            --repo "$GITHUB_REPOSITORY"
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              output/release/*.deb \
              output/release/*.rpm \
              output/release/*.tgz \
              output/release/xaligo-darwin-* \
              output/release/xaligo-linux-* \
              output/release/xaligo-windows-* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "${args[@]}"
          fi

      - name: Set up Node.js for npm publish
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@xaligo'

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ needs.metadata.outputs.npm_tag }}
        run: |
          npm publish output/release/*.tgz --access public --tag "$NPM_TAG"
