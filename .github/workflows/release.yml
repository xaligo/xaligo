name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3 — without leading v). Defaults to VERSION.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      base_version: ${{ steps.meta.outputs.base_version }}
      package_version: ${{ steps.meta.outputs.package_version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_title: ${{ steps.meta.outputs.release_title }}
      prerelease: ${{ steps.meta.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          input_version="${{ github.event.inputs.version || '' }}"
          source_version="$(sed -n '1{s/^v//;p;q;}' VERSION)"
          base_version="${input_version:-$source_version}"

          if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $base_version. Must be X.Y.Z" >&2
            exit 1
          fi

          short_sha="$(git rev-parse --short=12 HEAD)"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            package_version="${base_version}+main.${{ github.run_number }}"
            release_tag="main-${{ github.run_number }}-${short_sha}"
            release_title="xaligo ${base_version} main ${short_sha}"
            prerelease="true"
          else
            package_version="$base_version"
            release_tag="v${base_version}"
            release_title="xaligo v${base_version}"
            prerelease="false"
          fi

          {
            echo "base_version=$base_version"
            echo "package_version=$package_version"
            echo "release_tag=$release_tag"
            echo "release_title=$release_title"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  package:
    name: Build Linux packages (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            platform: linux/amd64
          - goarch: arm64
            platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Ubuntu package image
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --load \
            -f docker/ubuntu.Dockerfile \
            -t "xaligo-package-ubuntu:${{ matrix.goarch }}" \
            .

      - name: Build Debian package
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e VERSION="${{ needs.metadata.outputs.package_version }}" \
            -e GOARCH="${{ matrix.goarch }}" \
            -e GOFLAGS="-buildvcs=false" \
            "xaligo-package-ubuntu:${{ matrix.goarch }}" \
            scripts/build/build-deb.sh

      - name: Build Rocky package image
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --load \
            -f docker/rocky.Dockerfile \
            -t "xaligo-package-rocky:${{ matrix.goarch }}" \
            .

      - name: Build RPM package
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e VERSION="${{ needs.metadata.outputs.package_version }}" \
            -e GOARCH="${{ matrix.goarch }}" \
            -e GOFLAGS="-buildvcs=false" \
            "xaligo-package-rocky:${{ matrix.goarch }}" \
            scripts/build/build-rpm.sh

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: xaligo-linux-packages-${{ matrix.goarch }}
          path: |
            output/packages/*.deb
            output/packages/*.rpm
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - metadata
      - package
      - npm-package

    steps:
      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          pattern: xaligo-linux-packages-*
          path: output/release
          merge-multiple: true

      - name: Download npm package
        uses: actions/download-artifact@v4
        with:
          name: xaligo-npm-package
          path: output/release

      - name: Create GitHub Release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
          RELEASE_TITLE: ${{ needs.metadata.outputs.release_title }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
        shell: bash
        run: |
          args=(
            "$RELEASE_TAG"
            output/release/*.deb
            output/release/*.rpm
            output/release/*.tgz
            output/release/xaligo-darwin-*
            output/release/xaligo-linux-*
            output/release/xaligo-windows-*
            --target "$GITHUB_SHA"
            --title "$RELEASE_TITLE"
            --notes "Automated package build for ${GITHUB_SHA}. Package version: ${PACKAGE_VERSION}."
            --repo "$GITHUB_REPOSITORY"
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              output/release/*.deb \
              output/release/*.rpm \
              output/release/*.tgz \
              output/release/xaligo-darwin-* \
              output/release/xaligo-linux-* \
              output/release/xaligo-windows-* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "${args[@]}"
          fi

  npm-package:
    name: Build npm package
    runs-on: ubuntu-latest
    needs: metadata

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Javy
        shell: bash
        run: |
          case "$(uname -m)" in
            x86_64) javy_arch="x86_64" ;;
            aarch64|arm64) javy_arch="arm" ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          javy_version="9.0.0"
          javy_asset="javy-${javy_arch}-linux-v${javy_version}.gz"
          curl -fsSL "https://github.com/bytecodealliance/javy/releases/download/v${javy_version}/${javy_asset}" -o /tmp/javy.gz
          curl -fsSL "https://github.com/bytecodealliance/javy/releases/download/v${javy_version}/${javy_asset}.sha256" -o /tmp/javy.sha256
          printf '%s  %s\n' "$(cut -d ' ' -f 1 /tmp/javy.sha256)" /tmp/javy.gz | sha256sum -c -
          gzip -dc /tmp/javy.gz > /tmp/javy
          sudo install -m 0755 /tmp/javy /usr/local/bin/javy
          javy --version

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Set npm package version
        env:
          VERSION: ${{ needs.metadata.outputs.package_version }}
        run: |
          node -e "const fs=require('node:fs'); const path='package.json'; const pkg=JSON.parse(fs.readFileSync(path, 'utf8')); pkg.version=process.env.VERSION; fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');"

      - name: Build npm package assets
        env:
          VERSION: ${{ needs.metadata.outputs.package_version }}
          NPM_PACKAGE_TARGETS: darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64
        run: |
          npm run build
          npm run build:npm-binaries
          mkdir -p output/packages
          npm pack --pack-destination output/packages

      - name: Upload npm package
        uses: actions/upload-artifact@v4
        with:
          name: xaligo-npm-package
          path: |
            output/packages/*.tgz
            bin/native/xaligo-*
          if-no-files-found: error
