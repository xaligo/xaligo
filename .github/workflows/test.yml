name: Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  version:
    name: Version bump
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check VERSION increased
        shell: bash
        run: |
          set -euo pipefail

          current_version="$(sed -n '1{s/^v//;p;q;}' VERSION)"
          if [[ ! "$current_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid VERSION: $current_version. Must be X.Y.Z" >&2
            exit 1
          fi
          package_version="$(node -p 'require("./package.json").version')"
          if [[ "$package_version" != "$current_version" ]]; then
            echo "package.json version must match VERSION: $package_version != $current_version" >&2
            exit 1
          fi

          if ! base_version="$(git show '${{ github.event.pull_request.base.sha }}:VERSION' 2>/dev/null | sed -n '1{s/^v//;p;q;}')"; then
            echo "Base branch has no VERSION file; only format was checked."
            exit 0
          fi
          if [[ ! "$base_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid base VERSION: $base_version. Must be X.Y.Z" >&2
            exit 1
          fi

          IFS=. read -r current_major current_minor current_patch <<< "$current_version"
          IFS=. read -r base_major base_minor base_patch <<< "$base_version"
          if (( current_major > base_major )) ||
             (( current_major == base_major && current_minor > base_minor )) ||
             (( current_major == base_major && current_minor == base_minor && current_patch > base_patch )); then
            echo "VERSION increased: $base_version -> $current_version"
            exit 0
          fi

          echo "VERSION must be increased for PRs to main: $base_version -> $current_version" >&2
          exit 1

  security:
    name: Security gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Set up security scanner
        run: make security-setup

      - name: Run security gate
        run: make security-check

  test:
    name: Go test
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/cargo-target
      ENGINE_STATICLIB: ${{ github.workspace }}/.cache/cargo-target/release/libxaligo_engine.a

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/cargo-target
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('external/**/Cargo.lock', 'test/unit/external/**/Cargo.lock') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Download Go dependencies
        run: go mod download

      - name: Run native Go and Rust tests
        run: make test-engine

  external:
    name: npm package tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test npm native installer
        run: npm run test:npm-installer

      - name: Test release metadata
        run: npm run test:release-metadata
