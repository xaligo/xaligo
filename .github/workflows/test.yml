name: Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  version:
    name: Version bump
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check VERSION increased
        shell: bash
        run: |
          set -euo pipefail

          current_version="$(sed -n '1{s/^v//;p;q;}' VERSION)"
          if [[ ! "$current_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION: $current_version. Must be X.Y.Z" >&2
            exit 1
          fi

          if ! base_version="$(git show '${{ github.event.pull_request.base.sha }}:VERSION' 2>/dev/null | sed -n '1{s/^v//;p;q;}')"; then
            echo "Base branch has no VERSION file; only format was checked."
            exit 0
          fi
          if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid base VERSION: $base_version. Must be X.Y.Z" >&2
            exit 1
          fi

          IFS=. read -r current_major current_minor current_patch <<< "$current_version"
          IFS=. read -r base_major base_minor base_patch <<< "$base_version"
          if (( current_major > base_major )) ||
             (( current_major == base_major && current_minor > base_minor )) ||
             (( current_major == base_major && current_minor == base_minor && current_patch > base_patch )); then
            echo "VERSION increased: $base_version -> $current_version"
            exit 0
          fi

          echo "VERSION must be increased for PRs to main: $base_version -> $current_version" >&2
          exit 1

  test:
    name: Go test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Download Go dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build browser WebAssembly adapter
        run: GOOS=js GOARCH=wasm go build -o /tmp/xaligo-browser.wasm ./cmd/wasm

      - name: Verify native document encoders stay out of browser WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          dependencies="$(GOOS=js GOARCH=wasm go list -deps ./cmd/wasm)"
          if grep -Eq '^(github.com/tdewolff/canvas($|/)|github.com/xuri/excelize/v2($|/))' <<< "$dependencies"; then
            echo "Native PDF/Excel dependencies entered the browser WebAssembly graph." >&2
            exit 1
          fi

  external:
    name: TypeScript test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: external/package-lock.json

      - name: Install dependencies
        working-directory: external
        run: npm ci

      - name: Run tests
        working-directory: external
        run: npm test

      - name: Build exporters
        working-directory: external
        run: npm run build
