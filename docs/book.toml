[book]
title = "xaligo Documentation"
authors = ["xaligo contributors"]
description = "Official documentation for the xaligo diagram-as-code engine"
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[preprocessor.tabs]
command = "mdbook-tabs"

[output.html]
git-repository-url = "https://github.com/xaligo/xaligo"
edit-url-template = "https://github.com/xaligo/xaligo/edit/main/docs/{path}"
site-url = "/xaligo/"
additional-css = ["theme/tabs.css"]
additional-js = ["theme/tabs.js"]

[output.html.fold]
enable = true
level = 1
