      .subtitle { font-size: 34px; }
      .cardTitle { font-size: 32px; font-weight: 750; }
      .number { font-size: 42px; font-weight: 800; }
      .strokeBlue { stroke: #2f9dff; }
      .strokeCyan { stroke: #00eadb; }
      .strokeGreen { stroke: #92f044; }
      .line { fill: none; stroke: url(#cyanGreen); stroke-width: 4; filter: url(#glow); }
      .thin { fill: none; stroke: #1a7eb5; stroke-width: 1; opacity: 0.55; }
      .card { fill: url(#cardFill); stroke-width: 2.5; filter: url(#glow); }
      .dot { fill: #10e6dd; filter: url(#glow); }
