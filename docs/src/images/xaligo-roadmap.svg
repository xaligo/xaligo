      <stop offset="0.55" stop-color="#00e7d0"/>
      <stop offset="1" stop-color="#8ee933"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b3450" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#061423" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
