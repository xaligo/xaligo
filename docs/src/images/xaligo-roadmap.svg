<svg xmlns="http://www.w3.org/2000/svg" width="1792" height="1008" viewBox="0 0 1792 1008" role="img" aria-labelledby="title desc">
  <title id="title">xaligo Roadmap</title>
  <desc id="desc">Planned work for xaligo, covering rendering scale, input and output formats, editing and automation, runtime visualization, and advanced views.</desc>
