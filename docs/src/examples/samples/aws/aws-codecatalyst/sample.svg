ccessToken<tspan x="238" dy="19.2">API input (not an XAL attribute)</tspan><tspan x="238" dy="19.2">name*: string</tspan><tspan x="238" dy="19.2">expires Time: timestamp</tspan><tspan x="238" dy="19.2">Full input/output schema in API sheet</tspan></text><text data-owner="part-2" data-concept="item" x="674" y="370.8" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">CreateDevEnvironment<tspan x="674" dy="19.2">API input (not an XAL attribute)</tspan><tspan x="674" dy="19.2">instance Type*: string</tspan><tspan x="674" dy="19.2">persistent Storage*: object</tspan><tspan x="674" dy="19.2">alias: string</tspan><tspan x="674" dy="19.2">client Token: string</tspan><tspan x="674" dy="19.2">ides: list</tspan><tspan x="674" dy="19.2">Full input/output schema in API sheet</tspan></text><text data-owner="part-3" data-concept="item" x="1110" y="390" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">CreateProject<tspan x="1110" dy="19.2">API input (not an XAL attribute)</tspan><tspan x="1110" dy="19.2">description: string</tspan><tspan x="1110" dy="19.2">display Name*: string</tspan><tspan x="1110" dy="19.2">space Name*: string</tspan><tspan x="1110" dy="19.2">Full input/output schema in API sheet</tspan></text><text data-owner="part-4" data-concept="item" x="238" y="646.4" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">CreateSourceRepository<tspan x="238" dy="19.2">API input (not an XAL attribute)</tspan><tspan x="238" dy="19.2">name*: string</tspan><tspan x="238" dy="19.2">description: string</tspan><tspan x="238" dy="19.2">project Name*: string</tspan><tspan x="238" dy="19.2">space Name*: string</tspan><tspan x="238" dy="19.2">Full input/output schema in API sheet</tspan></text><text data-owner="part-5" data-concept="item" x="674" y="636.8" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">CreateSourceRepositoryBranch<tspan x="674" dy="19.2">API input (not an XAL attribute)</tspan><tspan x="674" dy="19.2">name*: string</tspan><tspan x="674" dy="19.2">head Commit Id: string</tspan><tspan x="674" dy="19.2">project Name*: string</tspan><tspan x="674" dy="19.2">source Repository Name*: string</tspan><tspan x="674" dy="19.2">space Name*: string</tspan><tspan x="674" dy="19.2">Full input/output schema in API sheet</tspan></text><text data-owner="part-6" data-concept="item" x="1110" y="636.8" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">StartDevEnvironment<tspan x="1110" dy="19.2">API input (not an XAL attribute)</tspan><tspan x="1110" dy="19.2">id*: string</tspan><tspan x="1110" dy="19.2">ides: list</tspan><tspan x="1110" dy="19.2">inactivity Timeout Minutes: integer</tspan><tspan x="1110" dy="19.2">instance Type: string</tspan><tspan x="1110" dy="19.2">project Name*: string</tspan><tspan x="1110" dy="19.2">Full input/output schema in API sheet</tspan></text><text data-owner="design-legend" data-concept="item" x="674" y="895.2" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">DESIGN CONTRACT / 図の読み方<tspan x="674" dy="19.2">* = required in the source schema, not a required XAL attribute. Values are not deployed to AWS.</tspan><tspan x="674" dy="19.2">Configuration / API cards are references, not automatically nested resources or network traffic.</tspan><tspan x="674" dy="19.2">Availability and region support must be checked before deployment. Research source/version and full parameter tables: README.</tspan></text><image x="182" y="73.333333" width="40" height="40" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/></svg>