" stroke-width="1.5"/><rect id="design-legend" data-concept="item" data-parent-index="7" x="32" y="849" width="1284" height="150" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text id="sample-metadata-0-key-text" data-owner="sample-metadata-0-key" data-concept="text" x="15" y="13.5" text-anchor="middle" dominant-baseline="middle" font-family="Virgil" font-size="12" fill="#64748b">id</text><text id="sample-metadata-0-value-text" data-owner="sample-metadata-0-value" data-concept="text" x="50" y="13.5" text-anchor="middle" dominant-baseline="middle" font-family="Virgil" font-size="12" fill="#64748b">sample</text><text id="sample-metadata-1-key-text" data-owner="sample-metadata-1-key" data-concept="text" x="102.5" y="13.5" text-anchor="middle" dominant-baseline="middle" font-family="Virgil" font-size="12" fill="#64748b">title</text><text id="sample-metadata-1-value-text" data-owner="sample-metadata-1-value" data-concept="text" x="197.5" y="13.5" text-anchor="middle" dominant-baseline="middle" font-family="Virgil" font-size="12" fill="#64748b">aws-vpc-vpn-connection</text><rect id="component-icon" data-owner="component" data-concept="item" data-icon="catalog:1589" x="178" y="69.333333" width="48" height="48" fill="none" stroke="none"/><text data-owner="component" data-concept="item" x="202" y="132" text-anchor="middle" font-family="Helvetica" font-size="10.666667" fill="#0f172a">Amazon VPC VPN Connection</text><text data-owner="overview" data-concept="item" x="864" y="124.2" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Design review / 設計レビュー<tspan x="864" dy="19.2">Research: resource-schema</tspan><tspan x="864" dy="19.2">AWS::EC2::VPNConnection</tspan><tspan x="864" dy="19.2">Functional structure and full reference tables are in README.</tspan></text><text data-owner="part-1" data-concept="item" x="238" y="380.4" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Resource configuration<tspan x="238" dy="19.2">VPNConnection</tspan><tspan x="238" dy="19.2">Type*: String</tspan><tspan x="238" dy="19.2">Customer Gateway Id*: String</tspan><tspan x="238" dy="19.2">Enable Acceleration: Boolean</tspan><tspan x="238" dy="19.2">Local Ipv4 Network Cidr: String</tspan><tspan x="238" dy="19.2">Local Ipv6 Network Cidr: String</tspan></text><text data-owner="part-2" data-concept="item" x="674" y="399.6" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Nested configuration<tspan x="674" dy="19.2">Vpn Tunnel Options Specifications -&gt;</tspan><tspan x="674" dy="19.2">object</tspan><tspan x="674" dy="19.2">DPDTimeout Action: String</tspan><tspan x="674" dy="19.2">DPDTimeout Seconds: Integer</tspan></text><text data-owner="part-3" data-concept="item" x="1110" y="370.8" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Additional parameters<tspan x="1110" dy="19.2">Outside Ip Address Type: String</tspan><tspan x="1110" dy="19.2">Pre Shared Key Storage: String</tspan><tspan x="1110" dy="19.2">Remote Ipv4 Network Cidr: String</tspan><tspan x="1110" dy="19.2">Remote Ipv6 Network Cidr: String</tspan><tspan x="1110" dy="19.2">Static Routes Only: Boolean</tspan><tspan x="1110" dy="19.2">Transit Gateway Id: String</tspan><tspan x="1110" dy="19.2">Complete field list in README</tspan></text><text data-owner="part-4" data-concept="item" x="238" y="646.4" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Referenced resource types<tspan x="238" dy="19.2">CustomerGateway</tspan><tspan x="238" dy="19.2">TransitGateway</tspan><tspan x="238" dy="19.2">VPNConcentrator</tspan><tspan x="238" dy="19.2">VPNGateway</tspan><tspan x="238" dy="19.2">Based on identifier fields</tspan><tspan x="238" dy="19.2">References are NOT child ownership</tspan></text><text data-owner="part-5" data-concept="item" x="674" y="646.4" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Operations / lifecycle<tspan x="674" dy="19.2">CreateVpnConnection</tspan><tspan x="674" dy="19.2">DescribeVpnConnections</tspan><tspan x="674" dy="19.2">DeleteVpnConnection</tspan><tspan x="674" dy="19.2">ModifyVpnConnection</tspan><tspan x="674" dy="19.2">CreateVpnConnectionRoute</tspan><tspan x="674" dy="19.2">Input / output schemas: linked API sheet</tspan></text><text data-owner="part-6" data-concept="item" x="1110" y="656" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Icon meaning / interpretation<tspan x="1110" dy="19.2">Amazon VPC VPN Connection</tspan><tspan x="1110" dy="19.2">Mapped resource model shown above</tspan><tspan x="1110" dy="19.2">Do not infer API fields from icon artwork</tspan><tspan x="1110" dy="19.2">Solid enclosure = authored membership</tspan><tspan x="1110" dy="19.2">Type references are not traffic paths</tspan></text><text data-owner="design-legend" data-concept="item" x="674" y="895.2" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">DESIGN CONTRACT / 図の読み方<tspan x="674" dy="19.2">* = required in the source schema, not a required XAL attribute. Values are not deployed to AWS.</tspan><tspan x="674" dy="19.2">Configuration / API cards are references, not automatically nested resources or network traffic.</tspan><tspan x="674" dy="19.2">Availability and region support must be checked before deployment. Research source/version and full parameter tables: README.</tspan></text><image x="182" y="73.333333" width="40" height="40" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/></svg>