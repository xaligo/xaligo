ateComment<tspan x="238" dy="19.2">API input (not an XAL attribute)</tspan><tspan x="238" dy="19.2">Document Id*: string</tspan><tspan x="238" dy="19.2">Text*: string</tspan><tspan x="238" dy="19.2">Version Id*: string</tspan><tspan x="238" dy="19.2">Authentication Token: string</tspan><tspan x="238" dy="19.2">Notify Collaborators: boolean</tspan><tspan x="238" dy="19.2">Full input/output schema in API sheet</tspan></text><text data-owner="part-2" data-concept="item" x="674" y="380.4" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">CreateCustomMetadata<tspan x="674" dy="19.2">API input (not an XAL attribute)</tspan><tspan x="674" dy="19.2">Custom Metadata*: map</tspan><tspan x="674" dy="19.2">Resource Id*: string</tspan><tspan x="674" dy="19.2">Authentication Token: string</tspan><tspan x="674" dy="19.2">Version Id: string</tspan><tspan x="674" dy="19.2">Full input/output schema in API sheet</tspan></text><text data-owner="part-3" data-concept="item" x="1110" y="390" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">CreateFolder<tspan x="1110" dy="19.2">API input (not an XAL attribute)</tspan><tspan x="1110" dy="19.2">Parent Folder Id*: string</tspan><tspan x="1110" dy="19.2">Authentication Token: string</tspan><tspan x="1110" dy="19.2">Name: string</tspan><tspan x="1110" dy="19.2">Full input/output schema in API sheet</tspan></text><text data-owner="part-4" data-concept="item" x="238" y="656" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">CreateLabels<tspan x="238" dy="19.2">API input (not an XAL attribute)</tspan><tspan x="238" dy="19.2">Labels*: list</tspan><tspan x="238" dy="19.2">Resource Id*: string</tspan><tspan x="238" dy="19.2">Authentication Token: string</tspan><tspan x="238" dy="19.2">Full input/output schema in API sheet</tspan></text><text data-owner="part-5" data-concept="item" x="674" y="6