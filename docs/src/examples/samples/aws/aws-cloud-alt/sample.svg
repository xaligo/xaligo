pan x="864" dy="19.2">Functional structure and full reference tables are in README.</tspan></text><text data-owner="part-1" data-concept="item" x="238" y="409.2" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Containment<tspan x="238" dy="19.2">AWS Cloud</tspan><tspan x="238" dy="19.2">Scope: global</tspan><tspan x="238" dy="19.2">Children retain individual identities</tspan></text><text data-owner="part-2" data-concept="item" x="674" y="409.2" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Boundary design<tspan x="674" dy="19.2">Border: solid</tspan><tspan x="674" dy="19.2">Color: #000000</tspan><tspan x="674" dy="19.2">Header: icon + measured label</tspan></text><text data-owner="part-3" data-concept="item" x="1110" y="409.2" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Membership / references<tspan x="1110" dy="19.2">Enclosure represents diagram membership</tspan><tspan x="1110" dy="19.2">Connections bind semantic child IDs</tspan><tspan x="1110" dy="19.2">Not an AWS deployment validator</tspan></text><text data-owner="part-4" data-concept="item" x="238" y="694.4" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Authoring parameters<tspan x="238" dy="19.2">id / title / width / height / layout</tspan></text><text data-owner="design-legend" data-concept="item" x="674" y="895.2" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">DESIGN CONTRACT / 図の読み方<tspan x="674" dy="19.2">* = required in the source schema, not a required XAL attribute. Values are not deployed to AWS.</tspan><tspan x="674" dy="19.2">Configuration / API cards are references, not automatically nested resources or network traffic.</tspan><tspan x="674" dy="19.2">Availability and region support must be checked before deployment. 