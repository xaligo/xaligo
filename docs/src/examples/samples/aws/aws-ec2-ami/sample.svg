<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1160" width="1500" height="1160"><rect id="sample" data-concept="frame" x="0" y="0" width="1500" height="1160" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><rect id="sample-metadata-0-key" data-concept="text" data-parent-index="1" x="4" y="4" width="22" height="19" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/><rect id="sample-metadata-0-value" data-concept="text" data-parent-index="1" x="26" y="4" width="48" height="19" fill="transparent" stroke="#cbd5e1" stroke-width="0.75"/><rect id="sample-metadata-1-key" data-concept="text" data-parent-index="1" x="82" y="4" width="41" height="19" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.75"/><rect id="sample-metadata-1-value" data-concept="text" data-parent-index="1" x="123" y="4" width="78" height="19" fill="transparent" stroke="#cbd5e1" stroke-width="0.75"/><rect id="overview" data-concept="item" data-parent-index="8" x="404" y="63" width="920" height="180" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect id="part-1" data-concept="item" data-parent-index="11" x="32" y="317" width="412" height="242" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect id="part-2" data-concept="item" data-parent-index="11" x="468" y="317" width="412" height="242" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect id="part-3" data-concept="item" data-parent-index="11" x="904" y="317" width="412" height="242" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect id="part-4" data-concept="item" data-parent-index="15" x="32" y="583" width="412" height="242" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect id="part-5" data-concept="item" data-parent-index="15" x="468" y="583" width="412" height="242" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect id="part-6" data-concept="item" data-parent-index="15" x="904" y="583" width="412" height="242" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect id="design-legend" data-concept="item" data-parent-index="7" x="32" y="849" width="1284" height="150" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text id="sample-metadata-0-key-text" data-owner="sample-metadata-0-key" data-concept="text" x="15" y="13.5" text-anchor="middle" dominant-baseline="middle" font-family="Virgil" font-size="12" fill="#64748b">id</text><text id="sample-metadata-0-value-text" data-owner="sample-metadata-0-value" data-concept="text" x="50" y="13.5" text-anchor="middle" dominant-baseline="middle" font-family="Virgil" font-size="12" fill="#64748b">sample</text><text id="sample-metadata-1-key-text" data-owner="sample-metadata-1-key" data-concept="text" x="102.5" y="13.5" text-anchor="middle" dominant-baseline="middle" font-family="Virgil" font-size="12" fill="#64748b">title</text><text id="sample-metadata-1-value-text" data-owner="sample-metadata-1-value" data-concept="text" x="162" y="13.5" text-anchor="middle" dominant-baseline="middle" font-family="Virgil" font-size="12" fill="#64748b">aws-ec2-ami</text><rect id="component-icon" data-owner="component" data-concept="item" data-icon="catalog:1784" x="178" y="69.333333" width="48" height="48" fill="none" stroke="none"/><text data-owner="component" data-concept="item" x="202" y="132" text-anchor="middle" font-family="Helvetica" font-size="10.666667" fill="#0f172a">Amazon EC2 AMI</text><text data-owner="overview" data-concept="item" x="864" y="124.2" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Design review / 設計レビュー<tspan x="864" dy="19.2">Research: service-context</tspan><tspan x="864" dy="19.2">AWS::EC2::Instance</tspan><tspan x="864" dy="19.2">Configuration context; icon itself may represent a feature.</tspan></text><text data-owner="part-1" data-concept="item" x="238" y="380.4" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Service configuration context<tspan x="238" dy="19.2">Instance</tspan><tspan x="238" dy="19.2">Availability Zone: String</tspan><tspan x="238" dy="19.2">Subnet Id: String</tspan><tspan x="238" dy="19.2">Security Group Ids: list</tspan><tspan x="238" dy="19.2">Instance Type: String</tspan><tspan x="238" dy="19.2">Image Id: String</tspan></text><text data-owner="part-2" data-concept="item" x="674" y="380.4" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Nested configuration<tspan x="674" dy="19.2">Block Device Mappings -&gt; object</tspan><tspan x="674" dy="19.2">Ebs: object</tspan><tspan x="674" dy="19.2">No Device: Json</tspan><tspan x="674" dy="19.2">Cpu Options -&gt; object</tspan><tspan x="674" dy="19.2">Core Count: Integer</tspan><tspan x="674" dy="19.2">Threads Per Core: Integer</tspan></text><text data-owner="part-3" data-concept="item" x="1110" y="370.8" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Additional parameters<tspan x="1110" dy="19.2">Additional Info: String</tspan><tspan x="1110" dy="19.2">Affinity: String</tspan><tspan x="1110" dy="19.2">Block Device Mappings: list</tspan><tspan x="1110" dy="19.2">Cpu Options: object</tspan><tspan x="1110" dy="19.2">Credit Specification: object</tspan><tspan x="1110" dy="19.2">Disable Api Termination: Boolean</tspan><tspan x="1110" dy="19.2">Complete field list in README</tspan></text><text data-owner="part-4" data-concept="item" x="238" y="627.2" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Referenced resource types<tspan x="238" dy="19.2">Host</tspan><tspan x="238" dy="19.2">LaunchTemplate</tspan><tspan x="238" dy="19.2">NetworkInterface</tspan><tspan x="238" dy="19.2">SecurityGroup</tspan><tspan x="238" dy="19.2">Subnet</tspan><tspan x="238" dy="19.2">Volume</tspan><tspan x="238" dy="19.2">Based on identifier fields</tspan><tspan x="238" dy="19.2">References are NOT child ownership</tspan></text><text data-owner="part-5" data-concept="item" x="674" y="646.4" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Operations / lifecycle<tspan x="674" dy="19.2">RunInstances</tspan><tspan x="674" dy="19.2">StartInstances</tspan><tspan x="674" dy="19.2">DescribeInstances</tspan><tspan x="674" dy="19.2">StopInstances</tspan><tspan x="674" dy="19.2">TerminateInstances</tspan><tspan x="674" dy="19.2">Input / output schemas: linked API sheet</tspan></text><text data-owner="part-6" data-concept="item" x="1110" y="656" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Icon meaning / interpretation<tspan x="1110" dy="19.2">Amazon EC2 AMI</tspan><tspan x="1110" dy="19.2">Service-level schema shown as context</tspan><tspan x="1110" dy="19.2">Do not infer API fields from icon artwork</tspan><tspan x="1110" dy="19.2">Solid enclosure = authored membership</tspan><tspan x="1110" dy="19.2">Type references are not traffic paths</tspan></text><text data-owner="design-legend" data-concept="item" x="674" y="895.2" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">DESIGN CONTRACT / 図の読み方<tspan x="674" dy="19.2">* = required in the source schema, not a required XAL attribute. Values are not deployed to AWS.</tspan><tspan x="674" dy="19.2">Configuration / API cards are references, not automatically nested resources or network traffic.</tspan><tspan x="674" dy="19.2">Availability and region support must be checked before deployment. Research source/version and full parameter tables: README.</tspan></text><image x="182" y="73.333333" width="40" height="40" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/></svg>