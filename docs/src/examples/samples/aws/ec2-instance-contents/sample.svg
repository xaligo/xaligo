t-index="16" x="32" y="583" width="412" height="242" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect id="part-5" data-concept="item" data-parent-index="16" x="468" y="583" width="412" height="242" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect id="part-6" data-concept="item" data-parent-index="16" x="904" y="583" width="412" height="242" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect id="design-legend" data-concept="item" data-parent-index="7" x="32" y="849" width="1284" height="150" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text id="sample-metadata-0-key-text" data-owner="sample-metadata-0-key" data-concept="text" x="15" y="13.5" text-anchor="middle" dominant-baseline="middle" font-family="Virgil" font-size="12" fill="#64748b">id</text><text id="sample-metadata-0-value-text" data-owner="sample-metadata-0-value" data-concept="text" x="50" y="13.5" text-anchor="middle" dominant-baseline="middle" font-family="Virgil" font-size="12" fill="#64748b">sample</text><text id="sample-metadata-1-key-text" data-owner="sample-metadata-1-key" data-concept="text" x="102.5" y="13.5" text-anchor="middle" dominant-baseline="middle" font-family="Virgil" font-size="12" fill="#64748b">title</text><text id="sample-metadata-1-value-text" data-owner="sample-metadata-1-value" data-concept="text" x="195" y="13.5" text-anchor="middle" dominant-baseline="middle" font-family="Virgil" font-size="12" fill="#64748b">ec2-instance-contents</text><rect id="component-icon" data-owner="component" data-concept="group" data-icon="group:EC2-instance-contents_32.svg" x="46" y="63" width="32" height="32" fill="none" stroke="none"/><text data-owner="component" data-concept="group" x="82" y="79" text-anchor="start" dominant-baseline="middle" font-family="Helvetica" font-size="14" fill="#E7601B">EC2 instance contents</text><text data-owner="member" data-concept="item" x="150" y="155" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#0f172a">Member / 子要素</text><text data-owner="overview" data-concept="item" x="864" y="124.2" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Design review / 設計レビュー<tspan x="864" dy="19.2">Research: resource-schema</tspan><tspan x="864" dy="19.2">AWS::EC2::Instance</tspan><tspan x="864" dy="19.2">Functional structure and full reference tables are in README.</tspan></text><text data-owner="part-1" data-concept="item" x="238" y="380.4" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Resource configuration<tspan x="238" dy="19.2">Instance</tspan><tspan x="238" dy="19.2">Availability Zone: String</tspan><tspan x="238" dy="19.2">Subnet Id: String</tspan><tspan x="238" dy="19.2">Security Group Ids: list</tspan><tspan x="238" dy="19.2">Instance Type: String</tspan><tspan x="238" dy="19.2">Image Id: String</tspan></text><text data-owner="part-2" data-concept="item" x="674" y="380.4" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Nested configuration<tspan x="674" dy="19.2">Block Device Mappings -&gt; object</tspan><tspan x="674" dy="19.2">Ebs: object</tspan><tspan x="674" dy="19.2">No Device: Json</tspan><tspan x="674" dy="19.2">Cpu Options -&gt; object</tspan><tspan x="674" dy="19.2">Core Count: Integer</tspan><tspan x="674" dy="19.2">Threads Per Core: Integer</tspan></text><text data-owner="part-3" data-concept="item" x="1110" y="370.8" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Additional parameters<tspan x="1110" dy="19.2">Additional Info: String</tspan><tspan x="1110" dy="19.2">Affinity: String</tspan><tspan x="1110" dy="19.2">Block Device Mappings: list</tspan><tspan x="1110" dy="19.2">Cpu Options: object</tspan><tspan x="1110" dy="19.2">Credit Specification: object</tspan><tspan x="1110" dy="19.2">Disable Api Termination: Boolean</tspan><tspan x="1110" dy="19.2">Complete field list in README</tspan></text><text data-owner="part-4" data-concept="item" x="238" y="684.8" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Referenced resource types<tspan x="238" dy="19.2">No peer type selected from ID fields</tspan><tspan x="238" dy="19.2">Full service type inventory in README</tspan></text><text data-owner="part-5" data-concept="item" x="674" y="684.8" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Operations / lifecycle<tspan x="674" dy="19.2">See resource lifecycle / updates</tspan><tspan x="674" dy="19.2">CloudFormation properties in README</tspan></text><text data-owner="part-6" data-concept="item" x="1110" y="656" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Icon meaning / interpretation<tspan x="1110" dy="19.2">EC2 instance contents</tspan><tspan x="1110" dy="19.2">Mapped resource model shown above</tspan><tspan x="1110" dy="19.2">Do not infer API fields from icon artwork</tspan><tspan x="1110" dy="19.2">Solid enclosure = authored membership</tspan><tspan x="1110" dy="19.2">Type references are not traffic paths</tspan></text><text data-owner="design-legend" data-concept="item" x="674" y="895.2" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">DESIGN CONTRACT / 図の読み方<tspan x="674" dy="19.2">* = required in the source schema, not a required XAL attribute. Values are not deployed to AWS.</tspan><tspan x="674" dy="19.2">Configuration / API cards are references, not automatically nested resources or network traffic.</tspan><tspan x="674" dy="19.2">Availability and region support must be checked before deployment. Research source/version and full parameter tables: README.</tspan></text><image x="46" y="63" width="32" height="32" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/></svg>