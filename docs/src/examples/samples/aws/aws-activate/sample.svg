xt><text data-owner="part-2" data-concept="item" x="674" y="399.6" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">2. Activate credits<tspan x="674" dy="19.2">Product / workflow concept</tspan><tspan x="674" dy="19.2">Use a separate connectable component</tspan><tspan x="674" dy="19.2">Not a CloudFormation property</tspan><tspan x="674" dy="19.2">See the product-specific guide</tspan></text><text data-owner="part-3" data-concept="item" x="1110" y="399.6" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">3. Technical resources<tspan x="1110" dy="19.2">Product / workflow concept</tspan><tspan x="1110" dy="19.2">Use a separate connectable component</tspan><tspan x="1110" dy="19.2">Not a CloudFormation property</tspan><tspan x="1110" dy="19.2">See the product-specific guide</tspan></text><text data-owner="part-4" data-concept="item" x="238" y="665.6" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">4. Account benefits<tspan x="238" dy="19.2">Product / workflow concept</tspan><tspan x="238" dy="19.2">Use a separate connectable component</tspan><tspan x="238" dy="19.2">Not a CloudFormation property</tspan><tspan x="238" dy="19.2">See the product-specific guide</tspan></text><text data-owner="design-legend" data-concept="item" x="674" y="895.2" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">DESIGN CONTRACT / 図の読み方<tspan x="674" dy="19.2">* = required in the source schema, not a required XAL attribute. Values are not deployed to AWS.</tspan><tspan x="674" dy="19.2">Configuration / API cards are references, not automatically nested resources or network traffic.</tspan><tspan x="674" dy="19.2">Availability and region support must be checked before deployment. Research source/version and full parameter tables: README.</tspan></text><image x="182" y="73.333333" width="40" height="40" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/></svg>