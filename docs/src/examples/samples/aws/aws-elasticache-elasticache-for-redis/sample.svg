nchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Service configuration context<tspan x="238" dy="19.2">ReplicationGroup</tspan><tspan x="238" dy="19.2">Security Group Ids: list</tspan><tspan x="238" dy="19.2">Port: Integer</tspan><tspan x="238" dy="19.2">Engine: String</tspan><tspan x="238" dy="19.2">At Rest Encryption Enabled: Boolean</tspan><tspan x="238" dy="19.2">Auth Token: String</tspan></text><text data-owner="part-2" data-concept="item" x="674" y="380.4" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Nested configuration<tspan x="674" dy="19.2">Log Delivery Configs -&gt; object</tspan><tspan x="674" dy="19.2">Dest Details*: object</tspan><tspan x="674" dy="19.2">Dest Type*: String</tspan><tspan x="674" dy="19.2">Node Group Config -&gt; object</tspan><tspan x="674" dy="19.2">Node Group Id: String</tspan><tspan x="674" dy="19.2">Primary Availability Zone: String</tspan></text><text data-owner="part-3" data-concept="item" x="1110" y="370.8" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Additional parameters<tspan x="1110" dy="19.2">Automatic Failover Enabled: Boolean</tspan><tspan x="1110" dy="19.2">Auto Minor Version Upgrade: Boolean</tspan><tspan x="1110" dy="19.2">Cache Node Type: String</tspan><tspan x="1110" dy="19.2">Cluster Mode: String</tspan><tspan x="1110" dy="19.2">Data Tiering Enabled: Boolean</tspan><tspan x="1110" dy="19.2">Durability: String</tspan><tspan x="1110" dy="19.2">Complete field list in README</tspan></text><text data-owner="part-4" data-concept="item" x="238" y="656" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Referenced resource types<tspan x="238" dy="19.2">GlobalReplicationGroup</tspan><tspan x="238" dy="19.2">SecurityGroup</tspan><tspan x="238" dy="19.2">UserGroup</tspan><tspan x="238" dy="19.2">Based on identifier fields</tspan><tspan x="238" dy="19.2">References are NOT child ownership</tspan></text><text data-owner="part-5" data-concept="item" x="674" y="646.4" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Operations / lifecycle<tspan x="674" dy="19.2">CreateReplicationGroup</tspan><tspan x="674" dy="19.2">DescribeReplicationGroups</tspan><tspan x="674" dy="19.2">DeleteReplicationGroup</tspan><tspan x="674" dy="19.2">ModifyReplicationGroup</tspan><tspan x="674" dy="19.2">CreateGlobalReplicationGroup</tspan><tspan x="674" dy="19.2">Input / output schemas: linked API sheet</tspan></text><text data-owner="part-6" data-concept="item" x="1110" y="646.4" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Icon meaning / interpretation<tspan x="1110" dy="19.2">Amazon ElastiCache ElastiCache for</tspan><tspan x="1110" dy="19.2">Redis</tspan><tspan x="1110" dy="19.2">Service-level schema shown as context</tspan><tspan x="1110" dy="19.2">Do not infer API fields from icon artwork</tspan><tspan x="1110" dy="19.2">Solid enclosure = authored membership</tspan><tspan x="1110" dy="19.2">Type references are not traffic paths</tspan></text><text data-owner="design-legend" data-concept="item" x="674" y="895.2" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">DESIGN CONTRACT / 図の読み方<tspan x="674" dy="19.2">* = required in the source schema, not a required XAL attribute. Values are not deployed to AWS.</tspan><tspan x="674" dy="19.2">Configuration / API cards are references, not automatically nested resources or network traffic.</tspan><tspan x="674" dy="19.2">Availability and region support must be checked before deployment. Research source/version and full parameter tables: README.</tspan></text><image x="182" y="73.166667" width="40" height="40" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/></svg>