ze="16" fill="#0f172a">Service configuration context<tspan x="238" dy="19.2">CloudAutonomousVmCluster</tspan><tspan x="238" dy="19.2">Autonomous Data Storage Size In TBs:</tspan><tspan x="238" dy="19.2">Double</tspan><tspan x="238" dy="19.2">Cloud Exadata Infrastructure Id: String</tspan><tspan x="238" dy="19.2">Cpu Core Count Per Node: Integer</tspan><tspan x="238" dy="19.2">Db Servers: list</tspan><tspan x="238" dy="19.2">Iam Roles: list</tspan></text><text data-owner="part-2" data-concept="item" x="674" y="380.4" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Nested configuration<tspan x="674" dy="19.2">Iam Roles -&gt; object</tspan><tspan x="674" dy="19.2">Aws Integration: String</tspan><tspan x="674" dy="19.2">Iam Role Arn: String</tspan><tspan x="674" dy="19.2">Maintenance Window -&gt; object</tspan><tspan x="674" dy="19.2">Days Of Week: list</tspan><tspan x="674" dy="19.2">Hours Of Day: list</tspan></text><text data-owner="part-3" data-concept="item" x="1110" y="361.2" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Additional parameters<tspan x="1110" dy="19.2">Is Mtls Enabled Vm Cluster: Boolean</tspan><tspan x="1110" dy="19.2">License Model: String</tspan><tspan x="1110" dy="19.2">Maintenance Window: object</tspan><tspan x="1110" dy="19.2">Memory Per Oracle Compute Unit In GBs:</tspan><tspan x="1110" dy="19.2">Integer</tspan><tspan x="1110" dy="19.2">Odb Network Id: String</tspan><tspan x="1110" dy="19.2">Scan Listener Port Non Tls: Integer</tspan><tspan x="1110" dy="19.2">Complete field list in README</tspan></text><text data-owner="part-4" data-concept="item" x="238" y="665.6" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Referenced resource types<tspan x="238" dy="19.2">CloudExadataInfrastructure</tspan><tspan x="238" dy="19.2">OdbNetwork</tspan><tspan x="238" dy="19.2">Based on identifier fields</tspan><tspan x="238" dy="19.2">References are NOT child ownership</tspan></text><text data-owner="part-5" data-concept="item" x="674" y="656" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Operations / lifecycle<tspan x="674" dy="19.2">CreateCloudAutonomousVmCluster</tspan><tspan x="674" dy="19.2">GetCloudAutonomousVmCluster</tspan><tspan x="674" dy="19.2">ListCloudAutonomousVmClusters</tspan><tspan x="674" dy="19.2">DeleteCloudAutonomousVmCluster</tspan><tspan x="674" dy="19.2">Input / output schemas: linked API sheet</tspan></text><text data-owner="part-6" data-concept="item" x="1110" y="656" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Icon meaning / interpretation<tspan x="1110" dy="19.2">Oracle Database at AWS</tspan><tspan x="1110" dy="19.2">Service-level schema shown as context</tspan><tspan x="1110" dy="19.2">Do not infer API fields from icon artwork</tspan><tspan x="1110" dy="19.2">Solid enclosure = authored membership</tspan><tspan x="1110" dy="19.2">Type references are not traffic paths</tspan></text><text data-owner="design-legend" data-concept="item" x="674" y="895.2" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">DESIGN CONTRACT / 図の読み方<tspan x="674" dy="19.2">* = required in the source schema, not a required XAL attribute. Values are not deployed to AWS.</tspan><tspan x="674" dy="19.2">Configuration / API cards are references, not automatically nested resources or network traffic.</tspan><tspan x="674" dy="19.2">Availability and region support must be checked before deployment. Research source/version and full parameter tables: README.</tspan></text><image x="182" y="73.333333" width="40" height="40" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/></svg>