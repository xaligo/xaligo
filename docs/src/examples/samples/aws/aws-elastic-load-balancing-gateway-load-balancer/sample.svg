x="238" y="361.2" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Resource configuration<tspan x="238" dy="19.2">LoadBalancer</tspan><tspan x="238" dy="19.2">Type: String</tspan><tspan x="238" dy="19.2">Ip Address Type: String</tspan><tspan x="238" dy="19.2">Enable Capacity Reservation Provision</tspan><tspan x="238" dy="19.2">Stabilize: Boolean</tspan><tspan x="238" dy="19.2">Enable Prefix For Ipv6 Source Nat: String</tspan><tspan x="238" dy="19.2">Enforce Security Group Inbound Rules On</tspan><tspan x="238" dy="19.2">Private Link Traffic: String</tspan></text><text data-owner="part-2" data-concept="item" x="674" y="390" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Nested configuration<tspan x="674" dy="19.2">Load Balancer Attributes -&gt; object</tspan><tspan x="674" dy="19.2">Key: String</tspan><tspan x="674" dy="19.2">Value: String</tspan><tspan x="674" dy="19.2">Minimum Load Balancer Capacity -&gt; object</tspan><tspan x="674" dy="19.2">Capacity Units*: Integer</tspan></text><text data-owner="part-3" data-concept="item" x="1110" y="370.8" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Additional parameters<tspan x="1110" dy="19.2">Ipv4 Ipam Pool Id: String</tspan><tspan x="1110" dy="19.2">Load Balancer Attributes: list</tspan><tspan x="1110" dy="19.2">Minimum Load Balancer Capacity: object</tspan><tspan x="1110" dy="19.2">Scheme: String</tspan><tspan x="1110" dy="19.2">Security Groups: list</tspan><tspan x="1110" dy="19.2">Subnet Mappings: list</tspan><tspan x="1110" dy="19.2">Complete field list in README</tspan></text><text data-owner="part-4" data-concept="item" x="238" y="684.8" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Referenced resource types<tspan x="238" dy="19.2">No peer type selected from ID fields</tspan><tspan x="238" dy="19.2">Full service type inventory in README</tspan></text><text data-owner="part-5" data-concept="item" x="674" y="646.4" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Operations / lifecycle<tspan x="674" dy="19.2">CreateLoadBalancer</tspan><tspan x="674" dy="19.2">CreateLoadBalancer</tspan><tspan x="674" dy="19.2">DescribeLoadBalancers</tspan><tspan x="674" dy="19.2">DescribeLoadBalancers</tspan><tspan x="674" dy="19.2">DeleteLoadBalancer</tspan><tspan x="674" dy="19.2">Input / output schemas: linked API sheet</tspan></text><text data-owner="part-6" data-concept="item" x="1110" y="646.4" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Icon meaning / interpretation<tspan x="1110" dy="19.2">Elastic Load Balancing Gateway Load</tspan><tspan x="1110" dy="19.2">Balancer</tspan><tspan x="1110" dy="19.2">Mapped resource model shown above</tspan><tspan x="1110" dy="19.2">Do not infer API fields from icon artwork</tspan><tspan x="1110" dy="19.2">Solid enclosure = authored membership</tspan><tspan x="1110" dy="19.2">Type references are not traffic paths</tspan></text><text data-owner="design-legend" data-concept="item" x="674" y="895.2" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">DESIGN CONTRACT / 図の読み方<tspan x="674" dy="19.2">* = required in the source schema, not a required XAL attribute. Values are not deployed to AWS.</tspan><tspan x="674" dy="19.2">Configuration / API cards are references, not automatically nested resources or network traffic.</tspan><tspan x="674" dy="19.2">Availability and region support must be checked before deployment. Research source/version and full parameter tables: README.</tspan></text><image x="182" y="73.166667" width="40" height="40" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/></svg>