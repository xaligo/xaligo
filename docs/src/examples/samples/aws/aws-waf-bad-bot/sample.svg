" stroke-width="1.5"/><rect id="design-legend" data-concept="item" data-parent-index="7" x="32" y="849" width="1284" height="150" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text id="sample-metadata-0-key-text" data-owner="sample-metadata-0-key" data-concept="text" x="15" y="13.5" text-anchor="middle" dominant-baseline="middle" font-family="Virgil" font-size="12" fill="#64748b">id</text><text id="sample-metadata-0-value-text" data-owner="sample-metadata-0-value" data-concept="text" x="50" y="13.5" text-anchor="middle" dominant-baseline="middle" font-family="Virgil" font-size="12" fill="#64748b">sample</text><text id="sample-metadata-1-key-text" data-owner="sample-metadata-1-key" data-concept="text" x="102.5" y="13.5" text-anchor="middle" dominant-baseline="middle" font-family="Virgil" font-size="12" fill="#64748b">title</text><text id="sample-metadata-1-value-text" data-owner="sample-metadata-1-value" data-concept="text" x="174.5" y="13.5" text-anchor="middle" dominant-baseline="middle" font-family="Virgil" font-size="12" fill="#64748b">aws-waf-bad-bot</text><rect id="component-icon" data-owner="component" data-concept="item" data-icon="catalog:1485" x="178" y="69.333333" width="48" height="48" fill="none" stroke="none"/><text data-owner="component" data-concept="item" x="202" y="132" text-anchor="middle" font-family="Helvetica" font-size="10.666667" fill="#0f172a">AWS WAF Bad Bot</text><text data-owner="overview" data-concept="item" x="864" y="124.2" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Design review / 設計レビュー<tspan x="864" dy="19.2">Research: service-context</tspan><tspan x="864" dy="19.2">AWS::WAFv2::WebACL</tspan><tspan x="864" dy="19.2">Configuration context; icon itself may represent a feature.</tspan></text><text data-owner="part-1" data-concept="item" x="238" y="380.4" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Service configuration context<tspan x="238" dy="19.2">WebACL</tspan><tspan x="238" dy="19.2">Default Action*: object</tspan><tspan x="238" dy="19.2">Scope*: String</tspan><tspan x="238" dy="19.2">Visibility Config*: object</tspan><tspan x="238" dy="19.2">Application Config: object</tspan><tspan x="238" dy="19.2">Association Config: object</tspan></text><text data-owner="part-2" data-concept="item" x="674" y="380.4" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Nested configuration<tspan x="674" dy="19.2">Default Action -&gt; object</tspan><tspan x="674" dy="19.2">Allow: object</tspan><tspan x="674" dy="19.2">Block: object</tspan><tspan x="674" dy="19.2">Visibility Config -&gt; object</tspan><tspan x="674" dy="19.2">Cloud Watch Metrics Enabled*: Boolean</tspan><tspan x="674" dy="19.2">Sampled Requests Enabled*: Boolean</tspan></text><text data-owner="part-3" data-concept="item" x="1110" y="370.8" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Additional parameters<tspan x="1110" dy="19.2">Captcha Config: object</tspan><tspan x="1110" dy="19.2">Challenge Config: object</tspan><tspan x="1110" dy="19.2">Custom Response Bodies: map</tspan><tspan x="1110" dy="19.2">Data Protection Config: object</tspan><tspan x="1110" dy="19.2">Monetization Config: object</tspan><tspan x="1110" dy="19.2">On Source DDo SProtection Config: object</tspan><tspan x="1110" dy="19.2">Complete field list in README</tspan></text><text data-owner="part-4" data-concept="item" x="238" y="684.8" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Referenced resource types<tspan x="238" dy="19.2">No peer type selected from ID fields</tspan><tspan x="238" dy="19.2">Full service type inventory in README</tspan></text><text data-owner="part-5" data-concept="item" x="674" y="646.4" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Operations / lifecycle<tspan x="674" dy="19.2">CreateWebACL</tspan><tspan x="674" dy="19.2">CreateWebACL</tspan><tspan x="674" dy="19.2">GetWebACL</tspan><tspan x="674" dy="19.2">GetWebACL</tspan><tspan x="674" dy="19.2">ListWebACLs</tspan><tspan x="674" dy="19.2">Input / output schemas: linked API sheet</tspan></text><text data-owner="part-6" data-concept="item" x="1110" y="656" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Icon meaning / interpretation<tspan x="1110" dy="19.2">AWS WAF Bad Bot</tspan><tspan x="1110" dy="19.2">Service-level schema shown as context</tspan><tspan x="1110" dy="19.2">Do not infer API fields from icon artwork</tspan><tspan x="1110" dy="19.2">Solid enclosure = authored membership</tspan><tspan x="1110" dy="19.2">Type references are not traffic paths</tspan></text><text data-owner="design-legend" data-concept="item" x="674" y="895.2" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">DESIGN CONTRACT / 図の読み方<tspan x="674" dy="19.2">* = required in the source schema, not a required XAL attribute. Values are not deployed to AWS.</tspan><tspan x="674" dy="19.2">Configuration / API cards are references, not automatically nested resources or network traffic.</tspan><tspan x="674" dy="19.2">Availability and region support must be checked before deployment. Research source/version and full parameter tables: README.</tspan></text><image x="182" y="73.333333" width="40" height="40" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/></svg>