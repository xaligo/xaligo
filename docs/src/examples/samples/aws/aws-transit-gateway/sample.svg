" stroke-width="1.5"/><rect id="design-legend" data-concept="item" data-parent-index="7" x="32" y="849" width="1284" height="150" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text id="sample-metadata-0-key-text" data-owner="sample-metadata-0-key" data-concept="text" x="15" y="13.5" text-anchor="middle" dominant-baseline="middle" font-family="Virgil" font-size="12" fill="#64748b">id</text><text id="sample-metadata-0-value-text" data-owner="sample-metadata-0-value" data-concept="text" x="50" y="13.5" text-anchor="middle" dominant-baseline="middle" font-family="Virgil" font-size="12" fill="#64748b">sample</text><text id="sample-metadata-1-key-text" data-owner="sample-metadata-1-key" data-concept="text" x="102.5" y="13.5" text-anchor="middle" dominant-baseline="middle" font-family="Virgil" font-size="12" fill="#64748b">title</text><text id="sample-metadata-1-value-text" data-owner="sample-metadata-1-value" data-concept="text" x="188.5" y="13.5" text-anchor="middle" dominant-baseline="middle" font-family="Virgil" font-size="12" fill="#64748b">aws-transit-gateway</text><rect id="component-icon" data-owner="component" data-concept="item" data-icon="catalog:1228" x="178" y="69.333333" width="48" height="48" fill="none" stroke="none"/><text data-owner="component" data-concept="item" x="202" y="132" text-anchor="middle" font-family="Helvetica" font-size="10.666667" fill="#0f172a">AWS Transit Gateway</text><text data-owner="overview" data-concept="item" x="864" y="124.2" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Design review / 設計レビュー<tspan x="864" dy="19.2">Research: resource-schema</tspan><tspan x="864" dy="19.2">AWS::EC2::TransitGateway</tspan><tspan x="864" dy="19.2">Functional structure and full reference tables are in README.</tspan></text><text data-owner="part-1" data-concept="item" x="238" y="370.8" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Resource configuration<tspan x="238" dy="19.2">TransitGateway</tspan><tspan x="238" dy="19.2">Side Asn: Long</tspan><tspan x="238" dy="19.2">Association Default Route Table Id:</tspan><tspan x="238" dy="19.2">String</tspan><tspan x="238" dy="19.2">Auto Accept Shared Attachments: String</tspan><tspan x="238" dy="19.2">Default Route Table Association: String</tspan><tspan x="238" dy="19.2">Default Route Table Propagation: String</tspan></text><text data-owner="part-2" data-concept="item" x="674" y="418.8" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Nested configuration<tspan x="674" dy="19.2">No nested object in selected model</tspan><tspan x="674" dy="19.2">See scalar fields and API operations</tspan></text><text data-owner="part-3" data-concept="item" x="1110" y="351.6" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Additional parameters<tspan x="1110" dy="19.2">Dns Support: String</tspan><tspan x="1110" dy="19.2">Encryption Support: String</tspan><tspan x="1110" dy="19.2">Multicast Support: String</tspan><tspan x="1110" dy="19.2">Propagation Default Route Table Id:</tspan><tspan x="1110" dy="19.2">String</tspan><tspan x="1110" dy="19.2">Security Group Referencing Support:</tspan><tspan x="1110" dy="19.2">String</tspan><tspan x="1110" dy="19.2">Transit Gateway Cidr Blocks: list</tspan><tspan x="1110" dy="19.2">Complete field list in README</tspan></text><text data-owner="part-4" data-concept="item" x="238" y="684.8" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Referenced resource types<tspan x="238" dy="19.2">No peer type selected from ID fields</tspan><tspan x="238" dy="19.2">Full service type inventory in README</tspan></text><text data-owner="part-5" data-concept="item" x="674" y="646.4" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Operations / lifecycle<tspan x="674" dy="19.2">CreateTransitGateway</tspan><tspan x="674" dy="19.2">DescribeTransitGateways</tspan><tspan x="674" dy="19.2">DeleteTransitGateway</tspan><tspan x="674" dy="19.2">ModifyTransitGateway</tspan><tspan x="674" dy="19.2">CreateTransitGatewayConnect</tspan><tspan x="674" dy="19.2">Input / output schemas: linked API sheet</tspan></text><text data-owner="part-6" data-concept="item" x="1110" y="656" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">Icon meaning / interpretation<tspan x="1110" dy="19.2">AWS Transit Gateway</tspan><tspan x="1110" dy="19.2">Mapped resource model shown above</tspan><tspan x="1110" dy="19.2">Do not infer API fields from icon artwork</tspan><tspan x="1110" dy="19.2">Solid enclosure = authored membership</tspan><tspan x="1110" dy="19.2">Type references are not traffic paths</tspan></text><text data-owner="design-legend" data-concept="item" x="674" y="895.2" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#0f172a">DESIGN CONTRACT / 図の読み方<tspan x="674" dy="19.2">* = required in the source schema, not a required XAL attribute. Values are not deployed to AWS.</tspan><tspan x="674" dy="19.2">Configuration / API cards are references, not automatically nested resources or network traffic.</tspan><tspan x="674" dy="19.2">Availability and region support must be checked before deployment. Research source/version and full parameter tables: README.</tspan></text><image x="182" y="73.333333" width="40" height="40" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/></svg>